<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Ming 🐱</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🐱 Neuro-Ming</h1>
            <div class="header-actions">
                <button id="mic-btn" title="Hold to talk (or press Space)" class="mic-btn">🎙️</button>
                <button id="mute-btn" title="Toggle voice">🔊</button>
                <button id="clear-btn" title="Clear conversation">🗑️</button>
            </div>
        </header>

        <div id="messages" class="messages">
            <div class="message bot">
                <div class="bubble">hey, I'm Neuro-Ming — Ming's AI twin. code, tech, smart home, whatever. meow.</div>
            </div>
        </div>

        <div id="typing" class="typing hidden">
            <span></span><span></span><span></span>
        </div>

        <div id="voice-status" class="voice-status hidden"></div>

        <form id="chat-form" class="chat-input">
            <input type="text" id="user-input" placeholder="say something... (hold Space to talk)" autocomplete="off" autofocus>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
