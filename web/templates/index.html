<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neuro-Ming 🐱</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <h1>🐱 Neuro-Ming</h1>
            <button id="clear-btn" title="Clear conversation">🗑️</button>
        </header>

        <div id="messages" class="messages">
            <div class="message bot">
                <div class="bubble">hey! I'm Neuro-Ming — part AI, part cat energy. ask me anything about code, tech, or life in Edmonton 🐱</div>
            </div>
        </div>

        <div id="typing" class="typing hidden">
            <span></span><span></span><span></span>
        </div>

        <form id="chat-form" class="chat-input">
            <input type="text" id="user-input" placeholder="say something..." autocomplete="off" autofocus>
            <button type="submit">Send</button>
        </form>
    </div>

    <script src="/static/chat.js"></script>
</body>
</html>
